services:
  - type: web
    name: client-management-api
    runtime: node
    plan: free
    region: frankfurt

    rootDir: backend

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 24.18.0

      - key: DATABASE_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false